<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('edrian-portfolio-theme'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="theme-color" content="#0B0E14" />

    <meta property="og:description" content="Connecting hardware, software, and practical ideas." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./favicon.png" />
